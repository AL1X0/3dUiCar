name: Build iPad app

# - push sur main / PR : compile et publie l'.ipa non signé en artefact
# - tag vX.Y.Z : idem + GitHub Release + mise à jour de la source SideStore
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["sidestore/**", "**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep 'MARKETING_VERSION' project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Car3DUI.xcodeproj \
            -target Car3DUI \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*Swift|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Release-iphoneos/Car3DUI.app

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Car3DUI.app Payload/
          zip -qry Car3DUI.ipa Payload
          ls -lh Car3DUI.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Car3DUI-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.build }}
          path: Car3DUI.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Car3DUI.ipa \
            --title "3dUiCar $GITHUB_REF_NAME" --generate-notes

      - name: Update SideStore source
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          SIZE=$(stat -f%z Car3DUI.ipa)
          git fetch origin main
          git checkout main
          python3 Tools/sidestore/update_source.py \
            --version "${{ steps.ver.outputs.version }}" \
            --build "${{ steps.ver.outputs.build }}" \
            --size "$SIZE" \
            --url "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/Car3DUI.ipa" \
            --notes "$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | head -20)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidestore/source.json
          git commit -m "SideStore: ${GITHUB_REF_NAME}"
          git push origin main
