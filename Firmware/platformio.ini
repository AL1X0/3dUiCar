[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags = -DCORE_DEBUG_LEVEL=1
lib_deps = 
    h2zero/NimBLE-Arduino@^1.4.2

[env:esp32dev]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1